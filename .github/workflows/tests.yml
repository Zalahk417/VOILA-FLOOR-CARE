name: tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate cinematic JavaScript
        run: |
          node --check website/content/assets/cinematic-house.js
          node --check website/content/assets/cinematic-timeline.js
          node --test tests/cinematic-timeline.test.cjs
      - name: Build House of Voilà website
        run: |
          cd website
          python build.py
          test -f dist/index.html
          grep -q 'id="house-tour"' dist/index.html
          grep -q 'id="welcome-layer"' dist/index.html
          grep -q 'id="scene-services"' dist/index.html
          grep -q 'href="/services/carpet-cleaning/"' dist/index.html
          grep -q 'id="house-lead-form"' dist/index.html
          grep -q 'id="lead-photos"' dist/index.html
          grep -q '0402 221 071' dist/index.html
