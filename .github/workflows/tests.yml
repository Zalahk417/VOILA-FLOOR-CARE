name: tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build House of Voilà website
        run: |
          cd website
          python build.py
          test -f dist/index.html
          grep -q 'id="house-tour"' dist/index.html
          grep -q 'class="hotspot-layer"' dist/index.html
          grep -q 'id="service-drawer"' dist/index.html
          grep -q 'Care starts with the surface' dist/index.html
